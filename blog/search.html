<script>
(function () {
  var DATA = [{"t":"测试内容","s":"是这种许昌哒哒哒哒哒反反复复收到过佛山东莞法式蛋糕","u":"posts/uncategorized/article-iF2oNzbaLW.html","d":"2026-11-17"}];
  var summary = document.getElementById('search-summary');
  var box = document.getElementById('search-results');
  if (!summary || !box) return;
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var params = new URLSearchParams(window.location.search);
  var query = (params.get('q') || '').trim().toLowerCase();
  if (!query) {
    summary.textContent = '请输入关键词后搜索';
    return;
  }
  var hits = DATA.filter(function (post) {
    return (post.t + ' ' + post.s).toLowerCase().indexOf(query) > -1;
  });
  summary.textContent = '找到 ' + hits.length + ' 篇与「' + query + '」相关的文章';
  if (!hits.length) {
    box.innerHTML = '<div class="empty">没有匹配的文章</div>';
    return;
  }
  box.innerHTML = hits.map(function (post) {
    return '<article class="post-item">' +
      '<div class="post-item__body">' +
      '<h2><a href="' + esc(post.u) + '">' + esc(post.t) + '</a></h2>' +
      (post.d ? '<div class="post-meta"><span>' + esc(post.d) + '</span></div>' : '') +
      '<p class="post-summary">' + esc(post.s) + '</p>' +
      '<a class="read-more" href="' + esc(post.u) + '">阅读全文 →</a>' +
      '</div></article>';
  }).join('');
})();
</script>

<script src="assets/recommend-index.js"></script>
<script>
(function () {
  var DATA = window.__RECOMMEND_INDEX__;
  var CUR = null;
  var aside = document.querySelector('.site-aside');
  if (!Array.isArray(DATA) || !aside) return;
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var prefix = "";

  // 详情页：按相关度重排推荐列表（无相关结果时保留模板原有内容）
  if (CUR) {
    var scored = DATA.filter(function (p) { return p.i !== CUR.i; }).map(function (p) {
      var shared = p.g.filter(function (t) { return CUR.g.indexOf(t) > -1; }).length;
      return { p: p, score: shared * 3 + (p.c && p.c === CUR.c ? 2 : 0) };
    }).filter(function (x) { return x.score > 0; })
      .sort(function (a, b) { return b.score - a.score || b.p.d.localeCompare(a.p.d); })
      .slice(0, 5);
    if (scored.length) {
      var list = aside.querySelector('.related-list');
      if (!list) {
        var block = document.createElement('section');
        block.className = 'side-block side-block--posts';
        block.innerHTML = '<h3>推荐文章</h3><ul class="related-list"></ul>';
        aside.appendChild(block);
        list = block.querySelector('.related-list');
      }
      list.innerHTML = scored.map(function (x) {
        var lv = String(Math.min(5, Math.max(1, Math.ceil(x.score / 2))));
        return '<li class="related-list__item related-list__item--lv' + lv + '"><a href="' + esc(prefix + x.p.u) + '">' + esc(x.p.t) + '</a></li>';
      }).join('');
    }
  }

  // 最新文章：排除当前文章后按日期降序取前 10 条，幂等更新区块
  var latest = DATA.filter(function (p) { return !CUR || p.i !== CUR.i; })
    .slice().sort(function (a, b) { return (b.d || '').localeCompare(a.d || ''); })
    .slice(0, 10);
  if (latest.length) {
    var latestBlock = aside.querySelector('.side-block--latest');
    if (!latestBlock) {
      latestBlock = document.createElement('section');
      latestBlock.className = 'side-block side-block--latest';
      latestBlock.innerHTML = '<h3>最新文章</h3><ul class="related-list"></ul>';
      var postsBlock = aside.querySelector('.side-block--posts');
      if (postsBlock) {
        aside.insertBefore(latestBlock, postsBlock);
      } else {
        aside.insertBefore(latestBlock, aside.firstChild);
      }
    }
    latestBlock.querySelector('.related-list').innerHTML = latest.map(function (p, i) {
      var lv = String(Math.max(1, 5 - Math.floor(i / 2)));
      return '<li class="related-list__item related-list__item--lv' + lv + '"><a href="' + esc(prefix + p.u) + '">' + esc(p.t) + '</a></li>';
    }).join('');
  }
})();
</script>
