<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello,World!!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .aurora-text {
            color: #666666;
            text-decoration: none;
            font-weight: bold;
            font-size: 42px;
            font-family: 'Futura', 'Century Gothic', sans-serif;
            margin-top: 35%;
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .aurora-text:hover {
            color: transparent;
            background: linear-gradient(
                270deg,
                #00f0ff,
                #7042fc,
                #ff006e,
                #ffbd59,
                #00f0ff,
                #7042fc,
                #ff006e,
                #ffbd59
            );
            background-size: 500% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: auroraWave 20s linear infinite;
            filter: brightness(1.2) contrast(1.1);
        }

        .aurora-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .aurora-text:hover::after {
            opacity: 0.7;
            background: linear-gradient(
                270deg,
                rgba(0,240,255,0.3),
                rgba(112,66,252,0.3),
                rgba(255,0,110,0.3),
                rgba(255,189,89,0.3)
            );
            background-size: 500% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: auroraWave 14s linear infinite reverse;
            filter: blur(16px);
        }

        @keyframes auroraWave {
            0%   { background-position: 0% 50%; }
            100% { background-position: 500% 50%; }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <a class="aurora-text" href="/blog" data-text="Hello,World~!">Hello,World~!</a>
    </div>
</body>
</html>
